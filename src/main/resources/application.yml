spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:postgresql://localhost:5432/wallet
    username: wallet
    password: wallet
    hikari:
      # A bounded pool with a short wait, so a slow database cannot exhaust the
      # service (techspec section 8, "Availability"). The timeout is in
      # milliseconds, HikariCP's unit for it.
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    # No view rendering here, so keep the session open only for the service layer.
    open-in-view: false
    hibernate:
      # Flyway is the only owner of the schema; Hibernate only checks it matches the entities.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  lifecycle:
    # Graceful shutdown: in-flight requests get this long to complete before the
    # process gives up on them (techspec section 8, "Availability").
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful

logging:
  structured:
    format:
      # One JSON line per log event (techspec section 8), rendered by Spring
      # Boot's built-in logstash formatter; no extra dependency.
      console: logstash

management:
  endpoint:
    health:
      # Component details stay private: a probe's caller needs the status, not the internals.
      show-details: never
      # Liveness and readiness groups for section 8 of the techspec; readiness includes the database.
      probes:
        enabled: true
      # Readiness says the service can serve: the application is up and its database reachable.
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,prometheus

wallet:
  outbox:
    # The publisher relays pending events on a fixed delay, in occurred_at order, in bounded batches.
    # Scheduling can be switched off wholesale; tests do that and drive publishing runs directly.
    scheduling-enabled: true
    publish-delay: 2s
    batch-size: 50
