spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:postgresql://localhost:5432/wallet
    username: wallet
    password: wallet
  jpa:
    # No view rendering here, so keep the session open only for the service layer.
    open-in-view: false
    hibernate:
      # Flyway is the only owner of the schema; Hibernate only checks it matches the entities.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

management:
  endpoint:
    health:
      # Liveness and readiness groups for section 8 of the techspec; readiness includes the database.
      probes:
        enabled: true

wallet:
  outbox:
    # The publisher relays pending events on a fixed delay, in occurred_at order, in bounded batches.
    # Scheduling can be switched off wholesale; tests do that and drive publishing runs directly.
    scheduling-enabled: true
    publish-delay: 2s
    batch-size: 50
