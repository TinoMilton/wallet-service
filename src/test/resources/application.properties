# Tests call a publishing run directly instead of waiting for the schedule (techspec 9.3:
# no sleeps). This file keeps the whole suite on the single shared application context, with
# no per-class property overrides: the trigger's delay here is far beyond any test run, and
# one run's batch covers the shared database, so publishing is deterministic.
wallet.outbox.publish-delay=PT256204778H
wallet.outbox.batch-size=10000
