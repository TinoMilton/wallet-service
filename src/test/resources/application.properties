# Tests call a publishing run directly instead of waiting for the schedule
# (techspec 9.3: no sleeps). This file applies to the whole suite and keeps it
# on the single shared application context: scheduling is off, and one run's
# batch covers the shared database, so a run reaches every event a test
# expects it to, whatever the backlog.
wallet.outbox.scheduling-enabled=false
wallet.outbox.batch-size=10000
