# One command runs the whole system: `docker compose up --build` builds the
# application image, starts PostgreSQL and waits for it to be healthy.
#
# The database service also stands on its own for local development:
# `docker compose up -d postgres` starts just PostgreSQL, and the application's
# own defaults in application.yml already point at localhost:5432.
#
# `docker compose --profile monitoring up` adds the observability stack:
# Prometheus scraping the application and the PostgreSQL exporter every 5
# seconds, and Grafana with its datasources and dashboards provisioned from
# monitoring/. Plain `docker compose up` still starts only app and PostgreSQL.
#
# The load generator is a k6 service under the separate profile `load`, so it
# never starts with plain `docker compose up` nor with `--profile monitoring`
# alone. It is run on demand, once, against the running stack:
#   docker compose run --rm k6
# It creates and funds its own wallets first, and its pace and length come from
# the WALLET_LOAD_* variables below.
#
# Every value a reviewer might need to change is an environment variable with a
# default, so no file needs editing when a port or credential is taken:
#   WALLET_APP_PORT            (default 8080)  host port for the application
#   WALLET_DB_PORT             (default 5432)  host port for PostgreSQL
#   WALLET_PROMETHEUS_PORT     (default 9090)  host port for Prometheus
#   WALLET_GRAFANA_PORT        (default 3000)  host port for Grafana
#   WALLET_GRAFANA_DB_PASSWORD (default grafana_reader)  password of the
#                               read-only role Grafana uses to query the wallet database
#   WALLET_LOAD_DURATION       (default 3m)   how long the load generator sends traffic
#   WALLET_LOAD_RATE           (default 20)   its requests per second
#   WALLET_LOAD_WALLETS        (default 30)   wallets it creates and trades with
#   POSTGRES_DB        (default wallet)
#   POSTGRES_USER      (default wallet)
#   POSTGRES_PASSWORD  (default wallet)
services:
  app:
    build: .
    container_name: wallet-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-wallet}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-wallet}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
    ports:
      - "${WALLET_APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
    ports:
      - "${WALLET_DB_PORT:-5432}:5432"
    healthcheck:
      # $$ keeps the variable lookup inside the container, not in compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: wallet-prometheus
    profiles: ["monitoring"]
    ports:
      - "${WALLET_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  postgres-exporter:
    # Server-side PostgreSQL metrics; no host port, it is scraped through the
    # compose network. Version 0.20.x supports PostgreSQL 18.
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: wallet-postgres-exporter
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-wallet}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-wallet}
    depends_on:
      postgres:
        condition: service_healthy

  grafana-db-reader:
    # One-shot: creates the login role Grafana uses to read the wallet tables.
    # It lives here and not in a Flyway migration, so monitoring never leaks
    # into the application schema.
    image: postgres:18-alpine
    container_name: wallet-grafana-db-reader
    profiles: ["monitoring"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-wallet}
      WALLET_GRAFANA_DB_PASSWORD: ${WALLET_GRAFANA_DB_PASSWORD:-grafana_reader}
    volumes:
      - ./monitoring/postgres/create-grafana-reader.sql:/create-grafana-reader.sql:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "${POSTGRES_USER:-wallet}", "-d", "${POSTGRES_DB:-wallet}", "-f", "/create-grafana-reader.sql"]
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    # Anonymous read-only Grafana: anyone who can reach this machine can view
    # the dashboards. That is acceptable for a local development stack only,
    # never for a deployment reachable by others.
    image: grafana/grafana:13.2.4
    container_name: wallet-grafana
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wallet-business.json
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
      WALLET_GRAFANA_DB_PASSWORD: ${WALLET_GRAFANA_DB_PASSWORD:-grafana_reader}
    ports:
      - "${WALLET_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
      grafana-db-reader:
        condition: service_completed_successfully

  k6:
    # The load generator for the dashboards. On demand only: the `load` profile
    # keeps it out of `docker compose up` and `--profile monitoring`, and
    # `docker compose run --rm k6` runs it once, attached, with its summary.
    # The script waits for the application's readiness itself, so a plain
    # service_started dependency is enough here.
    image: grafana/k6:2.3.0
    container_name: wallet-k6
    profiles: ["load"]
    environment:
      BASE_URL: http://app:8080
      LOAD_DURATION: ${WALLET_LOAD_DURATION:-3m}
      LOAD_RATE: ${WALLET_LOAD_RATE:-20}
      WALLETS: ${WALLET_LOAD_WALLETS:-30}
    volumes:
      - ./monitoring/load/wallet-traffic.js:/wallet-traffic.js:ro
    command: run /wallet-traffic.js
    depends_on:
      - app
