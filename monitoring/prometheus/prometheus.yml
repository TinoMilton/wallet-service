# Scrapes the wallet application and the PostgreSQL exporter every 5 seconds.
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: wallet-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
